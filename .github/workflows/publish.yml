name: Publish packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recover_tag:
        description: 'Optional exact package tag to recover after a partial release'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Release changed packages
    if: vars.NPM_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm pack:check
      - name: Configure release commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Release changed packages
        if: inputs.recover_tag == ''
        run: pnpm release
      - name: Recover an incomplete tagged release
        if: inputs.recover_tag != ''
        env:
          RECOVER_TAG: ${{ inputs.recover_tag }}
        run: pnpm release:recover "$RECOVER_TAG"
